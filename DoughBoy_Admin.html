<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DoughBoy — Menu Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --dg:#2D5016;--mg:#4A7C24;--gold:#C8960C;--cream:#F7F4EE;
  --red:#C0392B;--red-bg:#FFEBEE;--green-bg:#E8F5E9;
  --gray:#666;--lgray:#E8E8E8;--white:#fff;--ch:#2C2C2C;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--cream);min-height:100vh;}

/* Login screen */
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:var(--white);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.12);padding:36px 32px;max-width:380px;width:100%;text-align:center;}
.login-card h1{font-family:Georgia,serif;color:var(--dg);font-size:1.4rem;margin-bottom:6px;}
.login-card p{color:var(--gray);font-size:.85rem;margin-bottom:24px;}
.login-card input{width:100%;border:1.5px solid var(--lgray);border-radius:8px;padding:11px 14px;font-size:1rem;font-family:inherit;margin-bottom:14px;}
.login-card input:focus{outline:none;border-color:var(--mg);}
.login-btn{width:100%;padding:12px;background:var(--dg);color:var(--white);border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;}
.login-btn:hover{background:var(--mg);}
.login-error{color:var(--red);font-size:.83rem;margin-top:8px;display:none;}

/* Admin panel */
.admin{display:none;max-width:860px;margin:0 auto;padding:20px 16px 60px;}
.admin-hdr{background:var(--dg);border-radius:10px;padding:18px 22px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
.admin-hdr h1{font-family:Georgia,serif;color:var(--white);font-size:1.3rem;}
.admin-hdr .logout{background:rgba(255,255,255,.15);color:var(--white);border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px 14px;font-size:.8rem;cursor:pointer;font-family:inherit;}
.admin-hdr .logout:hover{background:rgba(255,255,255,.25);}

.save-bar{background:var(--gold);border-radius:8px;padding:12px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.save-bar span{color:var(--white);font-size:.88rem;font-weight:600;}
.save-btn{background:var(--white);color:var(--gold);border:none;border-radius:6px;padding:8px 20px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;}
.save-btn:hover{background:#FFF8E1;}

.sec-card{background:var(--white);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px;overflow:hidden;}
.sec-hdr{background:var(--dg);padding:10px 16px;font-weight:700;font-size:.9rem;color:var(--white);display:flex;align-items:center;justify-content:space-between;}
.sec-hdr .toggle-all{font-size:.75rem;font-weight:600;background:rgba(255,255,255,.2);border:none;color:var(--white);border-radius:4px;padding:3px 10px;cursor:pointer;font-family:inherit;}

.admin-item{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--lgray);transition:background .12s;}
.admin-item:last-child{border-bottom:none;}
.admin-item.unavail{background:var(--red-bg);}
.admin-item.avail{background:var(--white);}
.item-info .iname{font-weight:600;font-size:.88rem;color:var(--ch);}
.item-info .iprice{font-size:.78rem;color:var(--gray);margin-top:2px;}
.item-controls{display:flex;align-items:center;gap:10px;}
.status-badge{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:10px;}
.status-badge.avail{background:var(--green-bg);color:var(--mg);}
.status-badge.unavail{background:var(--red-bg);color:var(--red);}

/* Toggle switch */
.toggle-wrap{display:flex;align-items:center;gap:8px;}
.toggle-label{font-size:.78rem;color:var(--gray);}
.toggle{position:relative;width:44px;height:24px;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#ccc;border-radius:24px;cursor:pointer;transition:.2s;}
.toggle-slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:var(--white);border-radius:50%;transition:.2s;}
input:checked + .toggle-slider{background:var(--mg);}
input:checked + .toggle-slider:before{transform:translateX(20px);}

.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.stat{background:var(--white);border-radius:8px;padding:12px 16px;flex:1;min-width:120px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.07);}
.stat .num{font-size:1.6rem;font-weight:700;color:var(--dg);}
.stat .lbl{font-size:.75rem;color:var(--gray);margin-top:2px;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dg);color:var(--white);padding:10px 24px;border-radius:8px;font-size:.88rem;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login" id="login-screen">
  <div class="login-card">
    <h1>DoughBoy Admin</h1>
    <p>Menu availability manager<br>Enter your password to continue</p>
    <input type="password" id="pw-input" placeholder="Enter password"
      onkeydown="if(event.key==='Enter') doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error">Incorrect password. Please try again.</div>
  </div>
</div>

<!-- Admin Panel -->
<div class="admin" id="admin-panel">
  <div class="admin-hdr">
    <h1>&#x2699;&#xFE0F; Menu Availability Manager</h1>
    <button class="logout" onclick="doLogout()">Sign Out</button>
  </div>

  <div class="save-bar">
    <span>&#x1F4BE; Changes save automatically and update the live order form instantly.</span>
    <button class="save-btn" onclick="saveAndNotify()">Save Changes</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">Total Items</div></div>
    <div class="stat"><div class="num" id="stat-avail" style="color:var(--mg)">0</div><div class="lbl">Available</div></div>
    <div class="stat"><div class="num" id="stat-unavail" style="color:var(--red)">0</div><div class="lbl">Unavailable</div></div>
  </div>

  <div id="sections-container"></div>
</div>

<div class="toast" id="toast">Changes saved!</div>

<script>
const ADMIN_PASSWORD = 'DoughBoy2026!';

ked in smoked turkey."}, {"id": "si2h", "name": "Green Beans", "price": 65, "desc": "Cut green beans seasoned & simmered in smoked turkey."}, {"id": "si5h", "name": "Peas & Rice", "price": 55, "desc": "Seasoned peas and rice, Caribbean style."}, {"id": "si6h", "name": "Plain Rice", "price": 40, "desc": "Steamed white rice."}, {"id": "si7h", "name": "Mac & Cheese", "price": 65, "desc": "Aged cheddar & a blend of cheeses baked to creamy golden perfection using a pasta of your choice.", "pasta": true}, {"id": "si11h", "name": "Butternut Squash in Roasted Garlic Sauce", "price": 60, "desc": "Tender roasted butternut squash in a velvety roasted garlic sauce. Fully vegan.", "vegan": true}, {"id": "si1f", "name": "Collard Greens", "price": 90, "desc": "Hand-picked greens slow-cooked in smoked turkey."}, {"id": "si2f", "name": "Green Beans", "price": 80, "desc": "Cut green beans seasoned & simmered in smoked turkey."}, {"id": "si5f", "name": "Peas & Rice", "price": 80, "desc": "Seasoned peas and rice, Caribbean style."}, {"id": "si6f", "name": "Plain Rice", "price": 50, "desc": "Steamed white rice."}, {"id": "si7f", "name": "Mac & Cheese", "price": 100, "desc": "Aged cheddar & a blend of cheeses baked to creamy golden perfection using a pasta of your choice.", "pasta": true}, {"id": "si11f", "name": "Butternut Squash in Roasted Garlic Sauce", "price": 85, "desc": "Tender roasted butternut squash in a velvety roasted garlic sauce. Fully vegan.", "vegan": true}, {"id": "si9d", "name": "Drop Biscuits", "price": 28, "desc": "Golden, fluffy drop biscuits. Served with berry jelly or butter.", "priceLbl": "$28/dz"}, {"id": "d1d", "name": "Brownies", "price": 40, "desc": "Fudgy chocolate squares.", "priceLbl": "$40/dz"}, {"id": "d2d", "name": "Assorted Cookies", "price": 35, "desc": "Chocolate chip, oatmeal & toffee graham cracker cookies.", "priceLbl": "$35/dz"}, {"id": "d6d", "name": "Cheesecake Dessert Shooters", "price": 40, "desc": "Layered graham cracker crust & fruit filling. Choose: cherry, strawberry, apple, or blueberry.", "priceLbl": "$40/dz"}, {"id": "d3o", "name": "Golden Butter Pound Cake", "price": 50, "desc": "A delicious and moist 10-inch round cake baked to perfection.", "priceLbl": "$50 (10 inch round)"}, {"id": "d4o", "name": "5 Flavor Cake", "price": 65, "desc": "Hand-whipped 10-inch round cake infused with liqueur, vanilla & a special blend of spices.", "priceLbl": "$65 (10 inch round)"}, {"id": "d5a", "name": "Peach Cobbler - Half Pan", "price": 40, "desc": "Warm peach cobbler with bourbon glaze & drop biscuit topping.", "priceLbl": "$40/half pan"}, {"id": "d5b", "name": "Peach Cobbler - Full Pan", "price": 70, "desc": "Warm peach cobbler with bourbon glaze & drop biscuit topping.", "priceLbl": "$70/full pan"}];
const SECTIONS = {"bevs": ["rum1", "rum5", "rum10"], "app-half": ["a1h", "a2h", "a3h", "a5h"], "app-full": ["a1f", "a2f", "a3f", "a5f"], "app-doz": ["a6da", "a6db", "a9a", "a9b", "a10a", "a10b"], "sss": ["s1", "s1f", "s4", "s4f"], "ent-half": ["e1h", "e2h", "e3h", "e4h", "e5h", "e6h", "e8h", "e13h"], "ent-full": ["e1f", "e2f", "e3f", "e4f", "e5f", "e6f", "e8f", "e12f", "e13f"], "sid-half": ["si1h", "si2h", "si5h", "si6h", "si7h", "si11h"], "sid-full": ["si1f", "si2f", "si5f", "si6f", "si7f", "si11f"], "sid-doz": ["si9d"], "des-doz": ["d1d", "d2d", "d6d"], "des-oth": ["d3o", "d4o", "d5a", "d5b"]};
const SECTION_LABELS = {"app-half": "\ud83c\udf62 Appetizers \u2014 Half Pan", "app-full": "\ud83c\udf62 Appetizers \u2014 Full Pan", "app-doz": "\ud83c\udf62 Appetizers \u2014 By the Dozen", "sss": "\ud83e\udd57 Soups & Salads", "ent-half": "\ud83c\udf7d Entr\u00e9es \u2014 Half Pan", "ent-full": "\ud83c\udf7d Entr\u00e9es \u2014 Full Pan", "sid-half": "\ud83c\udf3d Sides \u2014 Half Pan", "sid-full": "\ud83c\udf3d Sides \u2014 Full Pan", "sid-doz": "\ud83c\udf3d Sides \u2014 By the Dozen", "bevs": "\ud83c\udf79 Beverages", "des-doz": "\ud83c\udf70 Desserts \u2014 By the Dozen", "des-oth": "\ud83c\udf70 Desserts \u2014 Cakes & Cobblers"};

let unavailableItems = JSON.parse(localStorage.getItem('db_unavailable') || '[]');

// ── Auth ──────────────────────────────────────────────────────────────────
function doLogin() {
  const pw = document.getElementById('pw-input').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display  = 'block';
    renderAdmin();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
  }
}

function doLogout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-panel').style.display  = 'none';
  document.getElementById('pw-input').value = '';
}

// ── Render ────────────────────────────────────────────────────────────────
function renderAdmin() {
  const container = document.getElementById('sections-container');
  container.innerHTML = '';

  Object.entries(SECTIONS).forEach(([secKey, itemIds]) => {
    const label = SECTION_LABELS[secKey] || secKey;
    const sectionItems = ITEMS.filter(i => itemIds.includes(i.id));
    if (!sectionItems.length) return;

    const card = document.createElement('div');
    card.className = 'sec-card';
    card.innerHTML = `
      <div class="sec-hdr">
        <span>${label}</span>
        <button class="toggle-all" onclick="toggleSection('${secKey}')">Toggle All</button>
      </div>
      ${sectionItems.map(item => {
        const isUnavail = unavailableItems.includes(item.id);
        const priceLbl = item.priceLbl || '$'+item.price;
        return `
          <div class="admin-item ${isUnavail ? 'unavail' : 'avail'}" id="admin-row-${item.id}">
            <div class="item-info">
              <div class="iname">${item.name}</div>
              <div class="iprice">${priceLbl}</div>
            </div>
            <div class="item-controls">
              <span class="status-badge ${isUnavail ? 'unavail' : 'avail'}" id="badge-${item.id}">
                ${isUnavail ? 'Unavailable' : 'Available'}
              </span>
              <label class="toggle">
                <input type="checkbox" ${isUnavail ? '' : 'checked'}
                  onchange="toggleItem('${item.id}', this.checked)"
                  id="toggle-${item.id}"/>
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>`;
      }).join('')}
    `;
    container.appendChild(card);
  });

  updateStats();
}

function toggleItem(id, available) {
  if (available) {
    unavailableItems = unavailableItems.filter(i => i !== id);
  } else {
    if (!unavailableItems.includes(id)) unavailableItems.push(id);
  }
  // Update row styling
  const row = document.getElementById('admin-row-'+id);
  const badge = document.getElementById('badge-'+id);
  if (row)  row.className  = 'admin-item ' + (available ? 'avail' : 'unavail');
  if (badge) { badge.className = 'status-badge ' + (available ? 'avail' : 'unavail'); badge.textContent = available ? 'Available' : 'Unavailable'; }
  saveChanges();
  updateStats();
}

function toggleSection(secKey) {
  const itemIds = SECTIONS[secKey] || [];
  const allUnavail = itemIds.every(id => unavailableItems.includes(id));
  itemIds.forEach(id => {
    const toggle = document.getElementById('toggle-'+id);
    if (toggle) { toggle.checked = allUnavail; toggleItem(id, allUnavail); }
  });
}

function saveChanges() {
  localStorage.setItem('db_unavailable', JSON.stringify(unavailableItems));
}

function saveAndNotify() {
  saveChanges();
  const toast = document.getElementById('toast');
  toast.className = 'toast show';
  setTimeout(() => toast.className = 'toast', 2500);
}

function updateStats() {
  const total   = ITEMS.length;
  const unavail = unavailableItems.filter(id => ITEMS.find(i => i.id === id)).length;
  document.getElementById('stat-total').textContent   = total;
  document.getElementById('stat-avail').textContent   = total - unavail;
  document.getElementById('stat-unavail').textContent = unavail;
}
</script>
</body>
</html>
